name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check whispertype tests

      - name: Type check
        run: mypy whispertype

      - name: Build onedir
        run: pyinstaller --clean --noconfirm whispertype.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperTypeSetup
          path: dist_installer/WhisperTypeSetup.exe
